; nextcloudonaws: php-fpm pool settings added on top of the upstream AIO configuration.
; Installed as /usr/local/etc/php-fpm.d/zzz-custom.conf. php-fpm includes the
; *.conf files of that directory in name order, so "zzz-" is read after
; docker.conf, www.conf and zz-docker.conf, and these values win.
; entrypoint.sh used to write this file at every start as www-data. The image
; now keeps the PHP config directories root-owned and read-only for others
; (upstream AIO 0bf4473c: the php-fpm master runs as root, so www-data must not
; be able to change its configuration), so the file is part of the image.
[www]
; Pass the container environment (ECS task definition and secrets) to the
; workers. config/*.php (redis, s3, postgres, smtp, ...) read it via getenv().
clear_env = no
; Log the backtrace of requests that run longer than 10 s to stderr, which the
; awslogs driver ships to CloudWatch Logs.
request_slowlog_timeout = 10
slowlog = /proc/self/fd/2
; Kill a worker after 60 s of wall-clock time so that a request stuck on the
; database, Redis or a syscall cannot hold a pool slot forever. Overrides the
; request_terminate_timeout = ${PHP_MAX_TIME} that the Dockerfile sets in www.conf.
request_terminate_timeout = 60
