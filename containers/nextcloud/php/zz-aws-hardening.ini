; nextcloudonaws: PHP settings added on top of the upstream AIO configuration.
; Installed as /usr/local/etc/php/conf.d/zz-aws-hardening.ini; the "zz-" prefix
; makes PHP read it after every other file in conf.d, so these values win.
; Applies to every SAPI in the image (php-fpm and the CLI used by occ/cron).

; Session upload progress.
; PHP writes upload progress into the session before any script runs, as soon
; as a multipart POST carries a field named after session.upload_progress.name.
; The application cannot opt out, so any client can trigger it. Nextcloud does
; not use the feature: no reference in server, the bundled apps or the web
; uploader (uploads are WebDAV PUT, checked on 34.0.4). The PHP advisory for
; CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp) recommends disabling it when unused,
; also after updating to a fixed release.
session.upload_progress.enabled = 0
